version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: globalradio
    bump: patch

build:
  toolchains: []
  run_buildscript: false

images:
  # Upstream publishes only the mutable `latest` tag, so the version source is the
  # digest of that channel: unchanged digests are a no-op, changed digests bump patch.
  - id: globalradio
    target: service
    service: globalradio
    source: docker.io/superneed/global-radio
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Global Radio
    summary: "在线电台播放器：搜索、收藏、历史与睡眠定时"